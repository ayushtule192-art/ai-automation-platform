# ─────────────────────────────────────────────────────────────────────────────
# AI Automation Platform — Local Development Stack
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d          # Start PostgreSQL + Redis
#   docker compose down           # Stop services
#   docker compose logs -f        # Tail logs
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_automation_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_automation_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-platform-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment after backend application code is implemented (Step 2+)
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: ../docker/backend/Dockerfile
  #   container_name: ai-platform-backend
  #   restart: unless-stopped
  #   env_file:
  #     - ./backend/.env
  #   ports:
  #     - "4000:4000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: ai-platform-network
